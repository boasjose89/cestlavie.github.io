<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Link Tree Responsivo</title>
    <style>
        * {
            box-sizing: border-box; /* Garante que o padding não quebre a largura */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0e0e0e; /* Fundo escuro sólido para melhor performance mobile */
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinha ao topo para permitir scroll se necessário */
            min-height: 100vh;
            padding-top: 40px;
        }

        .container {
            width: 100%;
            max-width: 400px; /* Limita a largura em desktops */
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-bottom: 10px;
            object-fit: cover;
            border: 2px solid #333;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #ccc;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .link-button {
            display: block;
            width: 100%; /* Ocupa a largura total do container */
            background-color: #222;
            color: white;
            padding: 16px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s ease;
            border: 1px solid #333;
        }

        /* Feedback visual ao toque no telemóvel */
        .link-button:active {
            background-color: #444;
            transform: scale(0.98);
        }

        /* Ajustes finos para ecrãs muito pequenos */
        @media (max-width: 320px) {
            .logo { width: 70px; height: 70px; }
            .link-button { padding: 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="Logo" class="logo">
        <h1>@teunome</h1>

        <div class="links-container">
            <a href="#" class="link-button">Link Importante 1</a>
            <a href="#" class="link-button">Link Importante 2</a>
            <a href="#" class="link-button">Link Importante 3</a>
            <a href="#" class="link-button">Link Importante 4</a>
        </div>
    </div>

</body>
</html>
