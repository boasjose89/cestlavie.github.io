<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C'est la Vie Esposende</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f2c3c2; 
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 10px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #555; /* Corrigido para ser visível no fundo rosa */
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .link-button {
            display: block;
            width: 100%;
            background-color: #fff9f9;
            color: black; /* Corrigido: era font-color */
            padding: 16px;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s ease;
        }

        .link-button:active {
            background-color: #eee;
            transform: scale(0.98);
        }

        @media (max-width: 320px) {
            .logo { width: 100px; height: 100px; }
            .link-button { padding: 12px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.jpg" alt="Logo" class="logo">
        <h1>@c.estlavie.brunchesposende</h1>

        <div class="links-container">
            <a href="#" class="link-button">Menu</a>
            <!-- O link será injetado pelo JavaScript abaixo -->
            <a href="#" id="link-dinamico" class="link-button">Instagram</a>
            <a href="#" class="link-button">Facebook</a>
            <a href="#" class="link-button">Google Review</a>
            <a href="#" class="link-button">Tripadvisor</a>
        </div>
    </div>

     <script>
    (function() {
    const btn = document.getElementById('link-dinamico');
    const userAgent = navigator.userAgent || navigator.vendor || window.opera;
    const instaUser = "c.estlavie.brunchesposende";
    
    const webUrl = "https://www.instagram.com/" + instaUser + "/";
    const appUri = "instagram://user?username=" + instaUser;

    if (/android/i.test(userAgent)) {
        // Tenta abrir via esquema nativo. Se falhar (app não instalada), 
        // o navegador Android geralmente lida com o fallback para a Web.
        btn.href = appUri;
        
        // Pequeno atraso para garantir que, se a app não abrir, 
        // o link aponte para a web como segurança
        setTimeout(function() {
            btn.href = "https://www.google.pt";
        }, 500);
    } else {
        // iOS e Desktop continuam com a URL padrão que funciona bem
        btn.href = "https://www.google.ptt";
    }
    
    btn.target = "_blank";
    btn.rel = "noopener noreferrer";
})();
    </script>
</body>
</html>
