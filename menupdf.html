<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Galeria com Zoom</title>
    
    <!-- Estilos da Galeria (PhotoSwipe) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    
    <style>
        :root { --accent: #89b4fa; --bg: #0b0b10; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: white; }

        /* Grelha da Galeria */
        .gallery-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas no mobile */
            gap: 10px;
            padding: 15px;
            padding-bottom: 100px; /* Espaço para o menu */
        }

        .gallery-item {
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gallery-item:active { transform: scale(0.95); }
        .gallery-item img { width: 100%; display: block; }

        /* Menu Inferior Fixo */
        #nav-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30, 30, 46, 0.95); backdrop-filter: blur(10px);
            border-radius: 25px; padding: 12px; width: 85%; z-index: 100;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .label { font-size: 11px; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="gallery-container" id="my-gallery">
        <!-- Item 1 -->
        <a href="menu_page-0001.jpg" 
           data-pswp-width="1200" 
           data-pswp-height="1600" 
           target="_blank" class="gallery-item">
            <img src="p1.jpg" alt="Menu Página 1" />
        </a>

        <!-- Item 2 -->
        <a href="menu_page-0002.jpg" 
           data-pswp-width="1200" 
           data-pswp-height="1600" 
           target="_blank" class="gallery-item">
            <img src="p2.jpg" alt="Menu Página 2" />
        </a>

        <!-- Item 3 (Adiciona quantos quiseres) -->
        <a href="menu_page-0003.jpg" 
           data-pswp-width="1200" 
           data-pswp-height="1600" 
           target="_blank" class="gallery-item">
            <img src="p3.jpg" alt="Menu Página 3" />
        </a>
    </div>

    <nav id="nav-bar">
        <div class="label">Toca na imagem para ampliar</div>
        <div style="font-size: 13px; opacity: 0.8;">Menu Digital Interativo</div>
    </nav>

    <!-- Scripts da Galeria -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#my-gallery',
            children: 'a',
            pswpModule: () => import('https://cdnjs.cloudflare.com')
        });
        
        lightbox.init();
    </script>

</body>
</html>
