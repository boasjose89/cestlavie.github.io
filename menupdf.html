<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu PDF Minimalista</title>
    <style>
        :root {
            --glass-bg: rgba(30, 30, 46, 0.85); /* Efeito de vidro escuro */
            --accent: #89b4fa;
            --text: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background-color: #11111b; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Contentor do PDF ocupa o ecrã todo */
        #pdf-viewer-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            scroll-behavior: smooth;
        }

        #pdf-canvas {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            max-width: 95%;
            height: auto;
            background: white;
        }

        /* MENU MINIMALISTA INFERIOR */
        #pdf-sidebar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            max-width: 90%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px); /* Efeito de desfoque atrás do menu */
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 10px 20px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #pdf-sidebar h3 { 
            font-size: 0.9rem; 
            margin: 0; 
            text-align: center; 
            color: var(--accent);
            cursor: pointer;
            padding-bottom: 5px;
        }

        #outline-list { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
            display: flex; /* Coloca os itens lado a lado */
            gap: 15px;
            overflow-x: auto; /* Permite scroll horizontal se houver muitos itens */
            max-height: 0; /* Escondido por padrão */
            opacity: 0;
            transition: all 0.4s ease;
        }

        /* Mostrar menu ao passar o rato ou clicar */
        #pdf-sidebar:hover #outline-list,
        #pdf-sidebar:active #outline-list {
            max-height: 200px;
            opacity: 1;
            padding-top: 15px;
            margin-bottom: 10px;
        }

        #outline-list li {
            white-space: nowrap; /* Não quebra linha */
            padding: 8px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text);
            transition: 0.2s;
        }

        #outline-list li:hover {
            background: var(--accent);
            color: #11111b;
        }

        /* Scrollbar fina para o menu horizontal */
        #outline-list::-webkit-scrollbar { height: 3px; }
        #outline-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .loading-msg { font-size: 0.8rem; color: var(--accent); }
    </style>
    
    <script src="https://cdnjs.cloudflare.com"></script>
</head>
<body>

    <main id="pdf-viewer-container">
        <canvas id="pdf-canvas"></canvas>
    </main>

    <nav id="pdf-sidebar">
        <h3>Índice ▾</h3>
        <ul id="outline-list">
            <li class="loading-msg">A carregar...</li>
        </ul>
    </nav>

    <script>
        const url = 'menu.pdf'; 

        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com';

        let pdfDoc = null;
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const outlineList = document.getElementById('outline-list');

        pdfjsLib.getDocument(url).promise.then(pdf => {
            pdfDoc = pdf;
            renderPage(1); 
            loadOutline();
        }).catch(err => {
            outlineList.innerHTML = `<li>Erro: ${err.message}</li>`;
        });

        async function loadOutline() {
            const outline = await pdfDoc.getOutline();
            outlineList.innerHTML = ''; 

            if (outline && outline.length > 0) {
                outline.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item.title;
                    li.onclick = (e) => {
                        e.stopPropagation(); // Evita fechar o menu ao clicar
                        handleOutlineClick(item.dest);
                    };
                    outlineList.appendChild(li);
                });
            } else {
                outlineList.innerHTML = '<li class="loading-msg">Sem índice interno no PDF</li>';
            }
        }

        async function handleOutlineClick(dest) {
            if (!dest) return;
            let pageIdx;
            if (typeof dest === 'string') {
                const explicitDest = await pdfDoc.getDestination(dest);
                pageIdx = await pdfDoc.getPageIndex(explicitDest[0]);
            } else {
                pageIdx = await pdfDoc.getPageIndex(dest[0]);
            }
            renderPage(pageIdx + 1);
            document.getElementById('pdf-viewer-container').scrollTop = 0;
        }

        function renderPage(num) {
            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: 1.5 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                page.render({ canvasContext: ctx, viewport: viewport });
            });
        }
    </script>
</body>
</html>
