<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Protegido</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --bg: #f2c3c2; --card: #1e1e2e; }
        body { margin: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; user-select: none; -webkit-user-select: none; }
        .menu-feed { width: 100%; max-width: 500px; padding: 20px 15px; }
        
        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            display: block;
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        /* Camada que impede o clique e o "guardar como" */
        .menu-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        .menu-card img { width: 100%; display: block; pointer-events: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="menu-feed" id="gallery">
        <!-- PÁGINAS COM data-pswp-src (sem href para não abrir em novo separador) -->
        <a data-pswp-src="1.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="1.jpg"></a>
        <a data-pswp-src="2.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="2.jpg"></a>
        <a data-pswp-src="3.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="3.jpg"></a>
        <a data-pswp-src="4.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="4.jpg"></a>
        <a data-pswp-src="5.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="5.jpg"></a>
        <a data-pswp-src="6.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="6.jpg"></a>
        <a data-pswp-src="7.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="7.jpg"></a>
        <a data-pswp-src="8.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="8.jpg"></a>
        <a data-pswp-src="9.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="9.jpg"></a>
        <a data-pswp-src="10.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="10.jpg"></a>
        <a data-pswp-src="11.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="11.jpg"></a>
        <a data-pswp-src="12.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="12.jpg"></a>
        <a data-pswp-src="13.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="13.jpg"></a>
        <a data-pswp-src="14.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="14.jpg"></a>
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://cloudflare.com';
        import PhotoSwipe from 'https://cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a', // Ele vai procurar pelos elementos 'a'
            pswpModule: PhotoSwipe
        });

        // Garante que o clique direito seja bloqueado no zoom
        lightbox.on('contentActivated', ({ content }) => {
            content.element.oncontextmenu = (e) => e.preventDefault();
        });
        
        lightbox.init();
    </script>
</body>
</html>
