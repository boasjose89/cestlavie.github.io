<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Interativo Fluido - Protegido</title>
    
    <!-- CSS PhotoSwipe -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root { 
            --accent: #89b4fa; 
            --bg: #f2c3c2; /* Nova cor de fundo aplicada */
            --card: #1e1e2e; 
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Feed de Imagens Centrado e Fluido */
        .menu-feed {
            width: 100%;
            max-width: 500px;
            padding: 20px 15px 120px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            display: block;
            width: 100%;
            -webkit-touch-callout: none;
        }

        .menu-card:active { transform: scale(0.98); }

        /* Camada Invisível de Proteção */
        .menu-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        .menu-card img {
            width: 100%;
            display: block;
            height: auto;
            pointer-events: none;
        }

        #nav-bar {
            position: fixed; bottom: 25px; 
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 30px; padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            z-index: 100;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="menu-feed" id="gallery">
        <!-- PÁGINAS 1 A 14 -->
        <a data-pswp-src="1.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="1.jpg" alt="Menu"></a>
        <a data-pswp-src="2.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="2.jpg" alt="Menu"></a>
        <a data-pswp-src="3.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="3.jpg" alt="Menu"></a>
        <a data-pswp-src="4.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="4.jpg" alt="Menu"></a>
        <a data-pswp-src="5.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="5.jpg" alt="Menu"></a>
        <a data-pswp-src="6.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="6.jpg" alt="Menu"></a>
        <a data-pswp-src="7.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="7.jpg" alt="Menu"></a>
        <a data-pswp-src="8.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="8.jpg" alt="Menu"></a>
        <a data-pswp-src="9.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="9.jpg" alt="Menu"></a>
        <a data-pswp-src="10.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="10.jpg" alt="Menu"></a>
        <a data-pswp-src="11.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="11.jpg" alt="Menu"></a>
        <a data-pswp-src="12.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="12.jpg" alt="Menu"></a>
        <a data-pswp-src="13.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="13.jpg" alt="Menu"></a>
        <a data-pswp-src="14.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="14.jpg" alt="Menu"></a>
    </div>

    <!-- Scripts PhotoSwipe -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cloudflare.com';
        import PhotoSwipe from 'https://cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            showHideAnimationType: 'zoom', 
            pswpModule: PhotoSwipe,
            initialZoomLevel: 'fit',
            secondaryZoomLevel: 2
        });

        lightbox.on('contentActivated', ({ content }) => {
            content.element.oncontextmenu = (e) => e.preventDefault();
        });
        
        lightbox.init();

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['s','u','p','i'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
        });
    </script>

</body>
</html>
