<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Digital</title>
    <style>
        :root { --accent: #89b4fa; --bg: #0b0b10; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: white; overflow: hidden; }

        /* Área da Imagem do Menu */
        #menu-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-bottom: 100px; /* Espaço para o menu inferior */
        }

        #menu-img {
            width: 100%;
            max-width: 600px; /* Largura ideal para leitura */
            height: auto;
            display: block;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        /* Menu Inferior Estilizado */
        #nav-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 46, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 10px 15px;
            width: 90%;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scroll-wrapper {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 0;
            scrollbar-width: none;
        }
        .scroll-wrapper::-webkit-scrollbar { display: none; }

        .btn-menu {
            padding: 12px 20px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 15px;
            color: white;
            white-space: nowrap;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-menu:active { background: var(--accent); color: #11111b; }
        
        .label { font-size: 11px; color: var(--accent); text-align: center; text-transform: uppercase; margin-bottom: 5px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="menu-container">
        <!-- Imagem inicial -->
        <img id="menu-img" src="p1.jpg" alt="Página do Menu">
    </div>

    <nav id="nav-bar">
        <div class="label">Páginas</div>
        <div class="scroll-wrapper">
            <!-- Altera os nomes e os ficheiros de imagem aqui -->
            <button class="btn-menu" onclick="changeImg('menu_page-0001.jpg')">1</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0002.jpg')">2</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0003.jpg')">3</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0004.jpg')">4</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0005.jpg')">5</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0006.jpg')">6</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0007.jpg')">7</button>
            <button class="btn-menu" onclick="changeImg('menu_page-0008.jpg')">8</button>
          
        </div>
    </nav>

    <script>
        function changeImg(src) {
            const img = document.getElementById('menu-img');
            const container = document.getElementById('menu-container');
            
            // Troca a imagem
            img.src = src;
            
            // Volta ao topo suavemente
            container.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>

</body>
</html>
