<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Interativo Fluido - Protegido</title>
    
    <!-- Estilos da Galeria (PhotoSwipe) -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root { --accent: #89b4fa; --bg: #FFFFFF; --card: #1e1e2e; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Proteção: Impede seleção de texto */
            user-select: none;
            -webkit-user-select: none;
        }

        header { padding: 30px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }

        .menu-feed {
            width: 100%;
            max-width: 500px;
            padding: 0 15px 120px;
            box-sizing: border-box;
        }

        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            display: block;
            /* Proteção: Impede menu "Guardar Imagem" em telemóveis */
            -webkit-touch-callout: none;
        }

        .menu-card:active { transform: scale(0.98); }

        /* Camada Invisível: Impede o clique direto na imagem */
        .menu-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        .menu-card img {
            width: 100%;
            display: block;
            height: auto;
            /* Proteção: Impede arrastar a imagem para fora do browser */
            pointer-events: none;
        }

        #nav-bar {
            position: fixed; bottom: 25px; 
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 30px; padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 100;
        }
    </style>
</head>
<body oncontextmenu="return false;"> <!-- Bloqueia clique direito global -->

    <!-- Script da Galeria e Proteções Extras -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cloudflare.com';
        import PhotoSwipe from 'https://cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            showHideAnimationType: 'zoom', 
            pswpModule: PhotoSwipe
        });
        
        // Bloqueia clique direito na imagem enquanto o Zoom está aberto
        lightbox.on('contentActivated', ({ content }) => {
            content.element.oncontextmenu = () => false;
        });

        lightbox.init();

        // Bloqueio de Teclas de Atalho (Ctrl+S, Ctrl+U, F12)
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p')) {
                e.preventDefault();
            }
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
            }
        });
    </script>
