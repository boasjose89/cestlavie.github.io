<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Interativo Fluido</title>
    
    <!-- Estilos da Galeria (Zoom) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    
    <style>
        :root { --accent: #89b4fa; --bg: #0b0b10; --card: #1e1e2e; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { padding: 30px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        header p { margin: 5px 0 0; opacity: 0.6; font-size: 0.9rem; }

        /* Lista de Imagens Fluida */
        .menu-feed {
            width: 100%;
            max-width: 500px;
            padding: 0 15px 120px;
            box-sizing: border-box;
        }

        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .menu-card:active { transform: scale(0.98); }

        .menu-card img {
            width: 100%;
            display: block;
            height: auto;
        }

        .card-info {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info span { font-weight: 600; font-size: 0.9rem; }
        .zoom-icon { color: var(--accent); font-size: 0.8rem; border: 1px solid var(--accent); padding: 4px 8px; border-radius: 10px; }

        /* Menu de Navegação Inferior */
        #nav-bar {
            position: fixed; bottom: 25px; 
            background: rgba(30, 30, 46, 0.8);
            backdrop-filter: blur(15px);
            border-radius: 30px; padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 100;
        }
    </style>
</head>
<body>

    <header>
        <h1>O Nosso Menu</h1>
    </header>

    <div class="menu-feed" id="gallery">
        <!-- PÁGINA 1 -->
        <a href="1.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card">
            <img src="1.jpg" alt="Entradas">
        </a>
         <!-- PÁGINA 2 -->
        <a href="2.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card">
            <img src="2.jpg" alt="Entradas">
        </a>

    </div>

  

    <!-- Script da Galeria Profissional -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            // Ativa transições fluidas de abertura/fecho
            showHideAnimationType: 'zoom', 
            pswpModule: () => import('https://cdnjs.cloudflare.com')
        });
        
        lightbox.init();
    </script>

</body>
</html>
