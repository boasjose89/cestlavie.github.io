<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Interativo Fluido - Protegido</title>
    
    <!-- CSS CORRETO DO PHOTOSWIPE -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root { --accent: #89b4fa; --bg: #FFFFFF; --card: #1e1e2e; }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background: var(--bg); 
            color: white; 
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .menu-feed {
            width: 100%;
            max-width: 500px;
            padding: 20px 15px 120px;
            box-sizing: border-box;
        }

        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            display: block;
            -webkit-touch-callout: none;
        }

        .menu-card:active { transform: scale(0.98); }

        /* Proteção: Camada invisível sobre a imagem */
        .menu-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
        }

        .menu-card img {
            width: 100%;
            display: block;
            height: auto;
            pointer-events: none; /* Impede arrastar */
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="menu-feed" id="gallery">
        <!-- Listagem das 14 Imagens -->
        <a href="1.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="1.jpg" alt="Menu"></a>
        <a href="2.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="2.jpg" alt="Menu"></a>
        <a href="3.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="3.jpg" alt="Menu"></a>
        <a href="4.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="4.jpg" alt="Menu"></a>
        <a href="5.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="5.jpg" alt="Menu"></a>
        <a href="6.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="6.jpg" alt="Menu"></a>
        <a href="7.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="7.jpg" alt="Menu"></a>
        <a href="8.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="8.jpg" alt="Menu"></a>
        <a href="9.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="9.jpg" alt="Menu"></a>
        <a href="10.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="10.jpg" alt="Menu"></a>
        <a href="11.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="11.jpg" alt="Menu"></a>
        <a href="12.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="12.jpg" alt="Menu"></a>
        <a href="13.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="13.jpg" alt="Menu"></a>
        <a href="14.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="14.jpg" alt="Menu"></a>
    </div>

    <!-- SCRIPTS CORRETOS E COMPLETOS -->
    <script type="module">
        import PhotoSwipeLightbox from 'https://cloudflare.com';
        import PhotoSwipe from 'https://cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            showHideAnimationType: 'zoom', 
            pswpModule: PhotoSwipe
        });

        // BLOQUEIA CLIQUE DIREITO DENTRO DO ZOOM
        lightbox.on('contentActivated', ({ content }) => {
            content.element.oncontextmenu = (e) => {
                e.preventDefault();
                return false;
            };
        });
        
        lightbox.init();

        // IMPEDE QUE O CLIQUE ABRA O LINK NUM NOVO SEPARADOR SE A GALERIA FALHAR
        document.querySelectorAll('.menu-card').forEach(link => {
            link.addEventListener('click', (e) => {
                // Se por algum motivo o PhotoSwipe não carregar, isto evita abrir o link direto
                if(!window.PhotoSwipeLightbox) e.preventDefault();
            });
        });

        // BLOQUEIO DE ATALHOS
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && ['s','u','p','i'].includes(e.key.toLowerCase())) e.preventDefault();
            if (e.key === 'F12') e.preventDefault();
        });
    </script>
</body>
</html>
