<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Protegido e Centrado</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --bg: #FFFFFF; --card: #1e1e2e; }
        
        body { 
            margin: 0; 
            background: var(--bg); 
            display: flex; 
            flex-direction: column; 
            align-items: center; /* Centra horizontalmente o feed no desktop */
            user-select: none; 
            -webkit-user-select: none; 
        }

        .menu-feed { 
            width: 100%; 
            max-width: 500px; 
            padding: 20px 15px; 
            box-sizing: border-box; /* Garante que o padding não "empurre" a imagem para fora */
            display: flex;
            flex-direction: column;
            align-items: center; /* Garante que cada card individual esteja centrado no telemóvel */
        }
        
        .menu-card {
            background: var(--card);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            display: block;
            width: 100%; /* Ocupa a largura total disponível do max-width */
            cursor: pointer;
            -webkit-touch-callout: none;
        }

        /* Proteção contra cópia */
        .menu-card::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
        }

        .menu-card img { 
            width: 100%; 
            height: auto; 
            display: block; 
            pointer-events: none; 
            margin: 0 auto; /* Reforço de centralização da tag img */
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="menu-feed" id="gallery">
        <!-- Substituí os 14 itens aqui (exemplo das primeiras 3) -->
        <a data-pswp-src="1.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="1.jpg"></a>
        <a data-pswp-src="2.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="2.jpg"></a>
        <a data-pswp-src="3.jpg" data-pswp-width="1200" data-pswp-height="1600" class="menu-card"><img src="3.jpg"></a>
        <!-- Repete o padrão para as restantes imagens até à 14.jpg -->
    </div>

    <script type="module">
        import PhotoSwipeLightbox from 'https://cloudflare.com';
        import PhotoSwipe from 'https://cloudflare.com';
        
        const lightbox = new PhotoSwipeLightbox({
            gallery: '#gallery',
            children: 'a',
            pswpModule: PhotoSwipe,
            // Melhora a visualização no telemóvel
            initialZoomLevel: 'fit',
            secondaryZoomLevel: 2,
        });

        lightbox.on('contentActivated', ({ content }) => {
            content.element.oncontextmenu = (e) => e.preventDefault();
        });
        
        lightbox.init();
    </script>
</body>
</html>
